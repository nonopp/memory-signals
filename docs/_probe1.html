<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>probe1</title>
<style>body{margin:0;background:#111;color:#eee}model-viewer{width:640px;height:480px;background:#000}</style>
<script type="module" src="/js/model-viewer.min.js"></script>
</head><body>
<model-viewer id="mv" src="/modelos/quikscat.glb" camera-controls interaction-prompt="none"
  shadow-intensity="0" exposure="1.1" alt="" field-of-view="30deg" loading="eager" reveal="auto"
  style="width:640px;height:480px"></model-viewer>
<script>
window.__ev = [];
const mv = document.getElementById('mv');
['load','error','progress'].forEach(e=>mv.addEventListener(e, ev=>{
  window.__ev.push(e + (ev.detail && ev.detail.total ? ':' + ev.detail.total : ''));
}));
</script>
</body></html>
