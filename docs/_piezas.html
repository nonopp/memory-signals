<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>piezas</title>
<style>
 body{margin:0;background:#111;color:#eee;font:12px monospace}
 model-viewer{width:660px;height:500px;background:#000}
 .p{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
    background:#ff3d3d;border:2px solid #fff;color:#fff;font:bold 10px/14px system-ui;text-align:center;
    box-shadow:0 0 6px #000;z-index:9}
</style>
<script type="module" src="/js/model-viewer.min.js"></script>
</head><body>
<model-viewer id="mv" camera-controls interaction-prompt="none" shadow-intensity="0" exposure="1.1"
  alt="" field-of-view="30deg" loading="eager" reveal="auto" style="width:660px;height:500px"></model-viewer>
<script>
const q = new URLSearchParams(location.search);
const mv = document.getElementById('mv');
mv.src = '/modelos/' + (q.get('m') || 'quikscat.glb');
if (q.get('o')) mv.cameraOrbit = q.get('o');

/* Caja de cada malla del modelo, en el MISMO espacio que las chinchetas (matrixWorld de three.js) */
window.__piezas = function(){
  const out = [];
  const raiz = mv.model;
  if (!raiz) return [{n:'SIN MODELO'}];
  raiz.updateMatrixWorld(true);
  raiz.traverse(function(o){
    if (!o.isMesh || !o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;
    const pos = o.geometry.attributes.position;
    const m = o.matrixWorld.elements;
    let mn = [Infinity,Infinity,Infinity], mx = [-Infinity,-Infinity,-Infinity];
    for (let i = 0; i < pos.count; i += Math.max(1, Math.floor(pos.count/4000))){
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const X = m[0]*x + m[4]*y + m[8]*z + m[12];
      const Y = m[1]*x + m[5]*y + m[9]*z + m[13];
      const Z = m[2]*x + m[6]*y + m[10]*z + m[14];
      if (X<mn[0]) mn[0]=X; if (Y<mn[1]) mn[1]=Y; if (Z<mn[2]) mn[2]=Z;
      if (X>mx[0]) mx[0]=X; if (Y>mx[1]) mx[1]=Y; if (Z>mx[2]) mx[2]=Z;
    }
    out.push({n: o.name || (o.parent && o.parent.name) || '?', v: pos.count,
              c: [(mn[0]+mx[0])/2, (mn[1]+mx[1])/2, (mn[2]+mx[2])/2],
              t: [mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]],
              mn: mn, mx: mx});
  });
  return out;
};
/* puntos concretos: se pide por nombre de malla y lado. lado: 'centro' o '+x -x +y -y +z -z' */
window.__punto = function(nombre, lado){
  const p = window.__piezas().filter(function(x){ return x.n === nombre; })[0];
  if (!p) return null;
  const c = p.c.slice();
  if (lado === '+x') c[0] = p.mx[0]; if (lado === '-x') c[0] = p.mn[0];
  if (lado === '+y') c[1] = p.mx[1]; if (lado === '-y') c[1] = p.mn[1];
  if (lado === '+z') c[2] = p.mx[2]; if (lado === '-z') c[2] = p.mn[2];
  return c;
};
window.__pines = function(lista){
  document.querySelectorAll('[slot^="hotspot"]').forEach(function(n){ n.remove(); });
  lista.forEach(function(p, i){
    const b = document.createElement('div');
    b.className = 'p'; b.setAttribute('slot', 'hotspot-' + i);
    b.setAttribute('data-position', p.join(' '));
    b.textContent = String(i + 1);
    mv.appendChild(b);
  });
  return lista.length;
};
window.__listo = false;
mv.addEventListener('load', function(){ window.__listo = true; });
</script>
</body></html>
